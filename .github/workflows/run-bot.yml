name: Run Telegram Config Bot

on:
  schedule:
    - cron: '0 */1 * * *'     # هر ۱ ساعت (به عنوان پشتیبان)
  workflow_dispatch:           # 🔑 این خط را اضافه کنید
  repository_dispatch:
    types: [run-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT: ${{ secrets.TARGET_CHAT }}
        run: |
          python bot.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # اضافه کردن هر دو فایل state و JSON
          git add last_messages.json configs.json bot_debug.log 2>/dev/null || true
          
          # اگر تغییری وجود داشت، commit و push کن
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Configs and state [skip ci]"
            git push
          fi
